<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>dots</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat+Brush&family=Patrick+Hand&display=swap">
<style>
/* Layout: one clickable storefront in the hand-inked black-and-white look of the paper wall.
   A flow bar on top jumps between the 11 screens; each screen is a real, working version of its sketch. */
:root{
  --bg:#ffffff; --ink:#101012; --mute:#62626b; --soft:#f2f2f5; --faint:#c9c9d1;
  --accent:#ff2f8e; --accent-ink:#ffffff; --note:#d9f24f; --note-ink:#16160f; --ok:#17924f; --bad:#c4242f;
  --f-display:'Caveat Brush','Segoe Print','Bradley Hand',cursive;
  --f-body:'Patrick Hand','Segoe Print','Comic Sans MS',cursive;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f0f12; --ink:#f3f3f1; --mute:#a0a0aa; --soft:#1b1b21; --faint:#3a3a44;
    --accent:#ff5aa5; --accent-ink:#14060d; --ok:#3ecf7e; --bad:#ff6b73; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f0f12; --ink:#f3f3f1; --mute:#a0a0aa; --soft:#1b1b21; --faint:#3a3a44;
  --accent:#ff5aa5; --accent-ink:#14060d; --ok:#3ecf7e; --bad:#ff6b73; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:18px/1.35 var(--f-body);padding-inline:16px;padding-block:0 40px}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;line-height:1;text-wrap:balance;letter-spacing:.01em}
p{margin:0}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin-inline:auto}
.sk{border:2px solid var(--ink);border-radius:14px 4px 12px 5px / 5px 12px 4px 14px}
.eyebrow{font-size:.85rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}

/* flow bar */
.flow{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:2px solid var(--ink);display:flex;align-items:center;gap:12px;padding-block:8px;margin-inline:-16px;padding-inline:16px}
.flabel{font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);white-space:nowrap}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;padding-block:2px;scrollbar-width:thin}
.chip{white-space:nowrap;border:2px solid var(--ink);border-radius:999px;padding:2px 12px;font-size:.95rem}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.done{background:var(--ink);color:var(--bg)}

/* header */
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px;padding-block:14px;border-bottom:2px solid var(--ink)}
.logo{font:2.4rem/1 var(--f-display);display:inline-flex;align-items:center}
.dot{display:inline-block;width:.62em;height:.62em;border-radius:50%;background:var(--ink);margin-inline:.03em;transform:translateY(.04em)}
.nav{display:flex;gap:20px;flex:1;min-width:0;flex-wrap:wrap}
.nav button{letter-spacing:.08em;padding-block:2px;border-bottom:3px solid transparent}
.nav button.on{border-bottom-color:var(--ink);font-weight:700}
.icons{display:flex;gap:6px;align-items:center}
.ibtn{position:relative;width:40px;height:40px;display:grid;place-items:center;border-radius:50%}
.ibtn:hover{background:var(--soft)}
.badge{position:absolute;top:2px;right:0;min-width:18px;height:18px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-size:.75rem;display:grid;place-items:center;padding-inline:4px}
.sbox{display:flex;gap:6px;align-items:center;flex-basis:100%;order:5}
.sbox input{flex:1;min-width:0}

/* generic controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 20px;border:2px solid var(--ink);border-radius:14px 4px 12px 5px / 5px 12px 4px 14px;background:var(--bg);letter-spacing:.04em}
.btn:hover{background:var(--soft)}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--ink);opacity:.85}
.btn.big{font-size:1.25rem;padding:12px 28px}
.btn.sm{padding:3px 14px;font-size:.95rem}
.btn[disabled]{opacity:.4;cursor:not-allowed}
input[type=text],input[type=number],input[type=email],select,textarea{background:var(--bg);border:2px solid var(--ink);border-radius:10px 3px 9px 4px / 4px 9px 3px 10px;padding:6px 10px;min-width:0}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--ink);margin:0;flex:none}
input[type=range]{accent-color:var(--ink);width:100%}
label{cursor:pointer}
.err{color:var(--bad);margin-top:8px}
.screen{padding-block:20px 8px;display:flex;flex-direction:column;gap:22px}
.note{align-self:flex-start;max-width:min(100%,560px);background:var(--note);color:var(--note-ink);padding:8px 14px;transform:rotate(-.6deg);box-shadow:3px 4px 0 color-mix(in srgb,var(--ink) 18%,transparent);font-size:.95rem}
.note summary{cursor:pointer;font-family:var(--f-display);font-size:1.15rem}
.note p{margin-top:4px}
.sticky{display:inline-block;background:var(--accent);color:var(--accent-ink);padding:6px 12px;font-family:var(--f-display);font-size:1.1rem;transform:rotate(2deg);box-shadow:3px 4px 0 color-mix(in srgb,var(--ink) 25%,transparent)}
.title{font-size:clamp(2.2rem,6vw,3.6rem)}
.sec{font-size:1.9rem;border-bottom:2px solid var(--ink);padding-bottom:6px}

/* placeholders and product cards */
.ph{display:block;width:100%;aspect-ratio:3/4;position:relative;border:2px solid var(--faint);border-radius:6px;background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--faint) 50%,transparent calc(50% + 1px)),
  linear-gradient(to bottom right,transparent calc(50% - 1px),var(--faint) 50%,transparent calc(50% + 1px))}
button.ph:hover{border-color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:18px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.cn{line-height:1.15}
.cp{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--mute)}
.cp s{opacity:.7;margin-right:6px}
.dots{display:inline-flex;gap:3px}
.dots b{width:11px;height:11px;border-radius:50%;border:1.5px solid var(--ink);display:block}
.heart{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--bg);border:2px solid var(--ink);display:grid;place-items:center}
.heart.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.heart.on svg{fill:currentColor}

/* swatches, pills */
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--ink);flex:none}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pill{min-width:44px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;text-align:center}
.pill.on{background:var(--ink);color:var(--bg)}
.pill[disabled]{opacity:.35}

/* intro */
.intro{display:grid;grid-template-columns:1fr 1.2fr .6fr;gap:24px;align-items:center;padding:24px;border:2px solid var(--ink);border-radius:14px 4px 12px 5px / 5px 12px 4px 14px;background:
  repeating-linear-gradient(177deg,transparent 0 5px,color-mix(in srgb,var(--ink) 10%,transparent) 5px 6px)}
.intro h1{font-size:clamp(3rem,9vw,5.2rem);margin-block:6px 12px}
.intro-l{display:flex;flex-direction:column;gap:16px;align-items:flex-start}
.sphere{max-width:360px;width:100%;margin-inline:auto}
.sphere svg{width:100%;height:auto;stroke:var(--ink);fill:none;stroke-width:2;stroke-linecap:round}
.sphere text{fill:var(--ink);stroke:none;font-family:var(--f-body)}
.tline{list-style:none;margin:0;padding:0 0 0 22px;position:relative;display:flex;flex-direction:column;gap:14px;border-left:2px solid var(--ink);margin-left:6px}
.tline li{position:relative;letter-spacing:.1em;text-transform:uppercase;font-size:.9rem}
.tline li::before{content:"";position:absolute;left:-30px;top:.28em;width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:var(--bg)}
.tline li:last-child{font-family:var(--f-display);font-size:1.4rem;letter-spacing:.04em}
.tline li:last-child::before{background:var(--ink)}

/* quiz */
.quiz{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;align-items:start}
.panel{border:2px solid var(--ink);border-radius:12px 4px 10px 4px / 4px 10px 4px 12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.panel h3{font-size:1.25rem;letter-spacing:.04em}
.tone{width:34px;height:34px;border-radius:50%;border:2px solid var(--ink)}
.tone.on{outline:3px solid var(--accent);outline-offset:2px}
.cols{display:flex;flex-direction:column;gap:20px}
.ring{width:84px;height:84px;position:relative;display:grid;place-items:center;font-family:var(--f-display);font-size:1.6rem}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.photo{position:relative;aspect-ratio:3/4;border:2px solid var(--ink);border-radius:8px;display:grid;place-items:center;overflow:hidden;background:var(--soft)}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.photo svg{width:62%;stroke:var(--ink);fill:var(--ink);stroke-width:2}
.photo label{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);white-space:nowrap}
.corner{position:absolute;width:26px;height:26px;border:3px solid var(--ink)}
.corner.a{top:12px;left:12px;border-right:0;border-bottom:0}.corner.b{top:12px;right:12px;border-left:0;border-bottom:0}
.corner.c{bottom:60px;left:12px;border-right:0;border-top:0}.corner.d{bottom:60px;right:12px;border-left:0;border-top:0}
.vis{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* home */
.pop{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:18px 20px;position:relative;background:
  repeating-linear-gradient(135deg,transparent 0 14px,color-mix(in srgb,var(--ink) 7%,transparent) 14px 15px)}
.pop h2{font-size:3rem}
.cats{display:flex;flex-wrap:wrap;gap:22px}
.cat{display:flex;flex-direction:column;align-items:center;gap:6px;letter-spacing:.08em;font-size:.85rem;text-transform:uppercase}
.cat i{width:76px;height:76px;border-radius:50%;border:2px solid var(--ink);display:block;background:
  linear-gradient(to top right,transparent calc(50% - 1px),var(--faint) 50%,transparent calc(50% + 1px)),
  linear-gradient(to bottom right,transparent calc(50% - 1px),var(--faint) 50%,transparent calc(50% + 1px))}
.cat:hover i,.cat.on i{background-color:var(--soft)}
.cat.on{font-weight:700;text-decoration:underline;text-underline-offset:5px}
.foot{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;border-top:2px solid var(--ink);padding-top:14px;margin-top:20px}
.tag{border:2px solid var(--ink);border-radius:5px;padding:0 8px;font-size:.85rem;letter-spacing:.08em}

/* listing */
.fpanel{display:grid;grid-template-columns:repeat(4,1fr);gap:0;border:2px solid var(--ink);border-radius:10px 3px 9px 3px / 3px 9px 3px 10px}
.fcol{padding:12px 14px;display:flex;flex-direction:column;gap:8px;border-right:2px solid var(--ink);min-width:0}
.fcol:last-child{border-right:0}
.fcol h3{font-size:1.1rem;letter-spacing:.1em}
.chk{display:flex;gap:8px;align-items:center;text-transform:capitalize}
.fbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}

/* product */
.prod{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:28px;align-items:start}
.prod h1{font-size:clamp(2.2rem,5vw,3.2rem);letter-spacing:.02em}
.lbl{font-size:.85rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:end}
.meas label{display:flex;flex-direction:column;gap:2px}
.ideal{border:2px solid var(--ink);border-radius:14px;padding:6px 10px;text-align:center;min-width:110px}
.ideal b{font-family:var(--f-display);font-size:2.2rem;font-weight:400;display:block;line-height:1}
.fit{position:relative;height:30px;margin-top:4px}
.fit::before{content:"";position:absolute;left:0;right:0;top:12px;height:3px;background:var(--ink)}
.fit i{position:absolute;top:6px;width:3px;height:15px;background:var(--ink)}
.fit b{position:absolute;top:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);transform:translateX(-50%)}
.fitl{display:flex;justify-content:space-between;font-size:.9rem;color:var(--mute)}
details.d{border-top:2px solid var(--ink);padding-block:8px}
details.d summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px}
details.d p,details.d ul{margin:8px 0 0;color:var(--mute)}
.stars{letter-spacing:.1em}
.sim{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sim .ph{aspect-ratio:1}

/* compare */
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.cmp .ph{aspect-ratio:1}
.cmp ul{margin:0;padding-left:20px}

/* bag */
.bag{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:24px;align-items:start}
.group h3{font-size:1.5rem;border-bottom:2px solid var(--ink);padding-bottom:4px;margin-bottom:12px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto auto;gap:10px 14px;align-items:center;padding:8px 12px;margin-bottom:12px}
.line .av{width:36px;height:36px;border-radius:50%;border:2px solid var(--ink)}
.line .nm{min-width:0}
.line .nm small{color:var(--mute);display:flex;align-items:center;gap:6px}
.stp{display:flex;align-items:center;gap:8px}
.stp button{width:28px;height:28px;border:2px solid var(--ink);border-radius:50%;line-height:1}
.sum{border:2px solid var(--ink);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:8px;text-align:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px)}
.sum .dotg{width:54px;height:54px;border-radius:50%;margin-inline:auto;background:var(--faint)}
.sum .dotg.ok{background:var(--ok)}
.sum dl{margin:0;display:flex;flex-direction:column;gap:2px}
.sum dt{font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
.sum dd{margin:0;font-size:1.3rem}

/* delivery & pay */
.two{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:26px;align-items:start}
.form{display:grid;grid-template-columns:90px minmax(0,1fr);gap:10px 12px;align-items:center}
.map{width:100%;height:auto;border:2px solid var(--ink);border-radius:6px;touch-action:none;cursor:grab;background:var(--soft)}
.map path{stroke:var(--ink);fill:none;stroke-width:2;stroke-linejoin:round}
.map .pin{fill:var(--accent);stroke:var(--ink);stroke-width:2}
.eta{border:2px solid var(--ink);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:10px}
.eta .big{font-family:var(--f-display);font-size:1.8rem}
.rowx{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.cardrow{display:grid;grid-template-columns:minmax(0,1fr) 110px auto;gap:10px;align-items:center}
.rem{font-size:.95rem}.rem.ok{color:var(--ok)}.rem.bad{color:var(--bad)}
.paybtn{width:100%;font-size:1.6rem;padding:14px}
.opt{display:flex;flex-wrap:wrap;gap:8px 22px}

/* done */
.done{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding:48px 16px;border:2px solid var(--ink);border-radius:14px 4px 12px 5px / 5px 12px 4px 14px}
.done h2{font-size:clamp(2.2rem,6vw,3.4rem)}
.dash{width:min(320px,80%);border-top:3px dashed var(--ink)}
.okdot{width:56px;height:56px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:var(--bg)}

/* modal + toast */
.mb{position:fixed;inset:0;z-index:50;background:rgba(10,10,14,.55);display:grid;place-items:center;padding:16px}
.modal{position:relative;width:min(420px,100%);background:var(--bg);padding:22px;display:flex;flex-direction:column;gap:14px}
.modal.lime{background:var(--note);color:var(--note-ink);border-color:var(--note-ink)}
.modal.lime input{color:var(--note-ink);border-color:var(--note-ink);background:transparent}
.modal.lime .btn{border-color:var(--note-ink);background:transparent;color:var(--note-ink)}
.x{position:absolute;top:-12px;right:-12px;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink);background:var(--bg);color:var(--ink);font-size:1.1rem;line-height:1}
.faces{display:flex;gap:16px;justify-content:center}
.face{width:56px;height:56px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center}
.face.on{background:var(--ink);color:var(--bg)}
.face svg{width:30px;height:30px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:999px;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1}

@media (max-width:860px){
  .intro,.quiz,.prod,.two,.bag{grid-template-columns:1fr}
  .tline{margin-top:6px}
  .sum{position:static}
  .fpanel{grid-template-columns:1fr 1fr}
  .fcol{border-bottom:2px solid var(--ink)}
}
@media (max-width:560px){
  .line{grid-template-columns:auto minmax(0,1fr) auto}
  .line .stp,.line .del{grid-column:2/-1}
  .cmp{gap:12px}
  .cardrow{grid-template-columns:minmax(0,1fr) 96px auto}
  .flabel{display:none}
  .fpanel{grid-template-columns:1fr}
  .fcol{border-right:0}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

function updatePay(){
 var T=totals().total,ok=true;
 if(S.multi){
  var sum=S.cards.reduce(function(a,c){return a+(+c.v||0)},0);
  var rem=$('#rem');
  if(S.mode==='amount'){ok=Math.abs(sum-T)<0.005;if(rem)rem.textContent=ok?'The split matches the total.':sum<T?money(T-sum)+' left to assign.':money(sum-T)+' over the total.'}
  else{ok=Math.abs(sum-100)<0.0005;if(rem)rem.textContent=ok?'The split adds up to 100%.':sum<100?(100-sum)+'% left to assign.':(sum-100)+'% over 100%.'}
  if(rem)rem.className='rem '+(ok?'ok':'bad');
  document.querySelectorAll('[data-bd]').forEach(function(el){el.textContent=money(cardAmt(+el.dataset.bd,T))});
 }
 var b=$('#pbtn');if(b){b.disabled=!ok||T<=0}
}
function setMode(m){
 var T=totals().total;
 if(m===S.mode)return;
 if(m==='percent'){var ps=S.cards.map(function(c){return Math.round((+c.v||0)/T*100)});var s=ps.reduce(function(a,b){return a+b},0);ps[ps.length-1]+=100-s;S.cards.forEach(function(c,i){c.v=ps[i]})}
 else{var as=S.cards.map(function(c){return +((+c.v||0)/100*T).toFixed(2)});var t=as.reduce(function(a,b){return a+b},0);as[as.length-1]=+(as[as.length-1]+T-t).toFixed(2);S.cards.forEach(function(c,i){c.v=as[i]})}
 S.mode=m;
}

 closefb:function(){S.fb=false;render(true)},
 closead:function(){S.adDismissed=true;render(true)},
 adsignup:function(){S.adDismissed=true;go('quiz')},
 signup:function(){var e=S.email.trim();if(!/^\S+@\S+\.\S+$/.test(e)){toast('Enter a valid email');return}S.signed=true;render(true)},
 tone:function(d){S.d.tone=+d.i;render(true)},
 sub:function(d){S.d.sub=d.v;render(true)},
 season:function(d){S.d.season=d.v;render(true)},
 pers:function(d){S.d.pers=d.v;render(true)},
 life:function(d){S.d.life=d.v;render(true)},
 quizgo:function(){S.diagDone=true;go('home')}
};
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-a]');if(!t||t.disabled)return;
 var f=A[t.dataset.a];if(f)f(t.dataset,t);
});
document.addEventListener('input',function(e){
 var t=e.target,k=t.dataset.in;if(!k)return;
 var v=t.value;
 if(k==='q')S.q=v;
 else if(k==='email')S.email=v;
 else if(k==='address')S.address=v;
 else if(k==='zip')S.zip=v;
 else if(k==='fbText')S.fbText=v;
 else if(k==='promoIn')S.promoIn=v;
 else if(k==='bust'||k==='waist'||k==='arms'){S.meas[k]=v;var el=$('#ideal');if(el)el.textContent=ideal()}
 else if(k==='clabel'){S.cards[+t.dataset.i].label=v;}
 else if(k==='cval'){S.cards[+t.dataset.i].v=v;updatePay()}
 else if(k==='height'||k==='weight'){S.d[k]=+v;S.d.body=true;$(k==='height'?'#hv':'#wv').textContent=v;var n=quizCount();$('#ringt').textContent=n+'/6';var r=2*Math.PI*36;$('#ringc').setAttribute('stroke-dashoffset',(r*(1-n/6)).toFixed(1))}
});
document.addEventListener('keydown',function(e){if(e.key==='Enter'&&e.target.id==='q'){A.dosearch()}});
document.addEventListener('change',function(e){
 var t=e.target,k=t.dataset.ch;if(!k)return;
 if(k==='fchk'){tgl(S.f[t.dataset.k],t.dataset.v);render(true)}
 else if(k==='fsort'){S.f.sort=t.dataset.v;render(true)}
 else if(k==='brand'){S.brand=t.value;render(true)}
 else if(k==='sel'){S.cart[+t.dataset.i].sel=t.checked;render(true)}
 else if(k==='gift'){S.gift=t.checked;render(true)}
 else if(k==='news'){S.news=t.checked;toast(t.checked?'You will get offers by email':'Unsubscribed');}
 else if(k==='country'){S.country=t.value;S.city='';render(true)}
 else if(k==='city'){S.city=t.value}
 else if(k==='multi'){S.multi=t.checked;if(S.multi)initCards();render(true)}
 else if(k==='mode'){setMode(t.dataset.v);render(true)}
 else if(k==='photo'){var f=t.files&&t.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){S.d.photo=rd.result;render(true)};rd.readAsDataURL(f)}
});
document.addEventListener('toggle',function(e){var t=e.target;if(t&&t.dataset&&t.dataset.k&&t.tagName==='DETAILS')S.open[t.dataset.k]=t.open},true);

render(false);
})();
</script>

</body></html>
